[project]
name = "cinder"
version = "0.1.0"
description = "A small SQL database in pure Python: B+trees on disk, a query planner and crash-safe transactions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cinder = "cinder.cli:main"

[tool.setuptools]
packages = ["cinder", "cinder.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
